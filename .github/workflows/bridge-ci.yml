name: Validate Telegram bridge

on:
  pull_request:
  push:
    branches:
      - main
      - perf/parallel-telegram-sdk-gas-startup-20261009

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free security and startup tests
        run: node --test tests/*.test.js
