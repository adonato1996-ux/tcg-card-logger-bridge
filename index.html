<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <title>TCG Card Logger</title>
  <script src="https://telegram.org/js/telegram-web-app.js?64" defer></script>
  <style>
    :root { color-scheme: dark; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1117; color: #e9eff7; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    #gas-frame { display: none; width: 100%; height: 100%; border: 0; background: #0d1117; }
    #message { padding: 28px 20px; line-height: 1.5; color: #c1cad5; }
    #message.error { color: #ffb4b4; }
  </style>
</head>
<body>
  <div id="message" role="status" aria-live="polite">Connessione sicura a Telegram…</div>
  <iframe id="gas-frame" title="TCG Card Logger — dati acquisto" referrerpolicy="no-referrer" allow="clipboard-write"></iframe>
  <script id="bridge-code">
    (function () {
      'use strict';
      var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzUF1lmp7OhjWgMbK0YOqAip1RgCQdNHdFMswpgPKXRvUCOqN4d97lPEy3jaoBmySLH/exec';
      // Start fetching the Apps Script iframe while the deferred Telegram SDK
      // is still loading. Authentication waits for both sides; no signed data
      // is exposed before Telegram supplies it and the iframe proves origin.
      var telegram = null;
      var pendingAuth = null;
      var didSendAuth = false;
      var token = new URLSearchParams(window.location.search).get('session');
      var message = document.getElementById('message');
      var iframe = document.getElementById('gas-frame');

      function fail() {
        message.textContent = 'Sessione non disponibile. Torna al bot Telegram e invia una nuova foto.';
        message.classList.add('error');
      }

      // Only the Apps Script iframe can request initialization data.
      // The nonce additionally binds each request to this one launch.
      function isGoogleFrameOrigin(origin) {
        return /^https:\/\/(?:(?:[a-z0-9-]+\.)?script|[a-z0-9-]+-script)\.googleusercontent\.com$/i.test(origin) ||
          origin === 'https://script.google.com';
      }

      // The token only locates an existing pending session; it never
      // authorizes a purchase. The server still validates signed Telegram
      // initData, owner and expiry before returning any card details.
      if (!/^[A-Za-z0-9_-]{1,256}$/.test(token || '')) {
        fail();
        return;
      }

      var bytes = new Uint8Array(32);
      crypto.getRandomValues(bytes);
      var nonce = Array.prototype.map.call(bytes, function (byte) {
        return ('0' + byte.toString(16)).slice(-2);
      }).join('');

      function deliverAuth() {
        if (didSendAuth || !telegram || !telegram.initData || !pendingAuth) return;
        didSendAuth = true;
        pendingAuth.source.postMessage({
          type: 'TCG_BRIDGE_AUTH', nonce: nonce, initData: telegram.initData
        }, pendingAuth.origin);
        pendingAuth = null;
      }

      window.addEventListener('message', function (event) {
        if (!event || event.source !== iframe.contentWindow ||
            !isGoogleFrameOrigin(event.origin) || !event.data ||
            event.data.nonce !== nonce) return;
        if (event.data.type === 'TCG_BRIDGE_AUTH_REQUEST') {
          if (!didSendAuth) {
            pendingAuth = { source: event.source, origin: event.origin };
            deliverAuth();
          }
        } else if (event.data.type === 'TCG_BRIDGE_CLOSE' && telegram) {
          telegram.close();
        }
      });

      // This is deliberately before DOMContentLoaded: the iframe network
      // request and the deferred Telegram SDK now run in parallel.
      iframe.src = WEB_APP_URL + '?session=' + encodeURIComponent(token) + '&bridgeNonce=' + nonce;
      iframe.style.display = 'block';
      message.style.display = 'none';

      // Deferred scripts finish before DOMContentLoaded. The iframe may
      // already be waiting for signed initData, which is delivered only now.
      window.addEventListener('DOMContentLoaded', function () {
        telegram = window.Telegram && window.Telegram.WebApp;
        if (!telegram || !telegram.initData) {
          iframe.style.display = 'none';
          message.style.display = 'block';
          fail();
          return;
        }
        telegram.ready();
        telegram.expand();
        if (telegram.MainButton) telegram.MainButton.hide();
        deliverAuth();
      });
    })();
  </script>
</body>
</html>
